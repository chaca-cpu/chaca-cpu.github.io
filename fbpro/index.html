<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastery FB Pro - Panduan Lengkap 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0066FF;
            --bg-body: #F4F7FE;
            --sidebar-white: #FFFFFF;
            --text-dark: #1B2559;
            --text-gray: #A3AED0;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); color: var(--text-dark); overflow-x: hidden; }

        /* --- HALAMAN DEPAN (PROMOSI) --- */
        #page-login {
            position: fixed; inset: 0; z-index: 1000;
            background: white; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .hero-promo { max-width: 500px; text-align: center; }
        .hero-promo h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2.2rem; color: var(--primary); margin-bottom: 15px; }
        .hero-promo p { color: var(--text-gray); margin-bottom: 30px; font-size: 1.1rem; }
        .input-group { background: #F4F7FE; padding: 30px; border-radius: 24px; }
        input[type="password"] {
            width: 100%; padding: 15px; border: 2px solid #E0E5F2; border-radius: 12px;
            font-size: 18px; text-align: center; margin-bottom: 15px; outline: none;
        }
        .btn-login {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--primary); color: white; font-weight: 700; cursor: pointer; font-size: 16px;
            transition: 0.2s;
        }
        .btn-login:hover { background: #0052cc; }

        /* --- LAYOUT UTAMA --- */
        #app-container { display: none; min-height: 100vh; }

        /* SIDEBAR */
        aside {
            width: 280px; background: var(--sidebar-white); height: 100vh;
            position: fixed; left: 0; top: 0; transition: var(--transition);
            border-right: 1px solid #E0E5F2; z-index: 500; overflow-y: auto;
        }
        aside.closed { transform: translateX(-100%); }
        
        .sidebar-brand { padding: 30px; border-bottom: 1px solid #F4F7FE; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; color: var(--primary); font-size: 1.2rem; }
        
        .menu-list { padding: 20px; }
        .menu-cat { font-size: 11px; font-weight: 700; color: var(--text-gray); text-transform: uppercase; margin: 20px 0 10px 10px; }
        .menu-item {
            padding: 14px 15px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; color: var(--text-gray);
            font-weight: 600; margin-bottom: 5px; transition: 0.2s;
        }
        .menu-item:hover { background: #F4F7FE; color: var(--primary); }
        .menu-item.active { background: var(--primary); color: white; box-shadow: 0 10px 20px rgba(0, 102, 255, 0.15); }

        /* MAIN CONTENT */
        main { flex: 1; margin-left: 280px; transition: var(--transition); min-height: 100vh; display: flex; flex-direction: column; }
        main.expanded { margin-left: 0; }

        .top-bar {
            padding: 20px 40px; display: flex; align-items: center; gap: 20px;
            position: sticky; top: 0; background: rgba(244, 247, 254, 0.9); backdrop-filter: blur(10px); z-index: 400;
        }
        .btn-toggle {
            background: white; border: 1px solid #E0E5F2; padding: 10px 15px; border-radius: 10px; cursor: pointer;
            font-weight: bold; color: var(--primary); font-size: 1rem;
        }

        .content-body { padding: 20px 40px 40px; max-width: 1000px; width: 100%; align-self: center; }
        .card { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 4px 25px rgba(0,0,0,0.03); border: 1px solid #E0E5F2; }
        
        h2 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.8rem; margin-bottom: 25px; color: var(--text-dark); border-left: 5px solid var(--primary); padding-left: 15px; }
        .materi-box { margin-bottom: 20px; }
        .materi-title { 
            display: flex; align-items: center; gap: 10px; font-weight: 700; 
            color: var(--primary); margin-bottom: 10px; font-size: 1.1rem;
        }
        .materi-text { color: #4D5E80; line-height: 1.8; margin-bottom: 15px; font-size: 1rem; }

        /* GRID UNTUK 50 TIPS */
        .tips-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .tip-card-simple { 
            background: #F4F7FE; padding: 15px 20px; border-radius: 12px; 
            display: flex; gap: 15px; align-items: center; transition: 0.2s;
        }
        .tip-card-simple:hover { background: #E0E5F2; transform: translateX(5px); }
        .tip-number { background: var(--primary); color: white; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; flex-shrink: 0; }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 768px) {
            aside { width: 100%; }
            main { margin-left: 0; }
            .content-body { padding: 15px; }
            .card { padding: 25px; }
        }
    </style>
</head>
<body>

    <div id="page-login">
        <div class="hero-promo">
            <div style="font-size: 50px; margin-bottom: 10px;">📈</div>
            <h1>FB Pro Mastery 2026</h1>
            <p>Dapatkan akses ke 200+ materi rahasia dan 50 strategi kilat gajian dari Facebook Profesional.</p>
            <div class="input-group">
                <input type="password" id="sandi" placeholder="Masukkan Kode Akses">
                <button class="btn-login" onclick="bukaData()">MASUK KE MEMBER AREA</button>
            </div>
            <p style="margin-top: 20px; font-size: 12px; color: #A3AED0;">Akses ini bersifat pribadi dan permanen.</p>
        </div>
    </div>

    <div id="app-container">
        <aside id="mySidebar">
            <div class="sidebar-brand">DASHBOARD VIP</div>
            <div class="menu-list">
                <div class="menu-cat">Materi Utama</div>
                <div id="m-inti" class="menu-item active" onclick="ganti('inti')">🏠 Panduan Dasar</div>
                <div id="m-konten" class="menu-item" onclick="ganti('konten')">🎥 Strategi Konten</div>
                
                <div class="menu-cat">Keamanan & Gaji</div>
                <div id="m-aman" class="menu-item" onclick="ganti('aman')">🛡️ Anti Banned</div>
                <div id="m-gaji" class="menu-item" onclick="ganti('gaji')">🏦 Sistem Payout</div>
                
                <div class="menu-cat">Eksklusif</div>
                <div id="m-tips" class="menu-item" onclick="ganti('tips')">💎 50 Tips Kilat</div>
            </div>
        </aside>

        <main id="myMain">
            <div class="top-bar">
                <button class="btn-toggle" onclick="toggleSidebar()">☰ Menu Navigasi</button>
            </div>

            <div class="content-body">
                <div class="card" id="render-materi">
                    </div>
            </div>
        </main>
    </div>

    <script>
        const passKey = "MTIz"; // Sandi: 123

        function bukaData() {
            const val = document.getElementById('sandi').value;
            if(btoa(val) === passKey) {
                document.getElementById('page-login').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                ganti('inti');
            } else { alert("Maaf, Kode Akses Salah!"); }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('mySidebar');
            const main = document.getElementById('myMain');
            sidebar.classList.toggle('closed');
            main.classList.toggle('expanded');
        }

        const database = {
            inti: `
                <h2>Panduan Dasar FB Pro</h2>
                <div class="materi-box">
                    <div class="materi-title">Langkah 1: Nama Akun Sesuai KTP</div>
                    <div class="materi-text">Bapak/Ibu, pastikan nama di profil Facebook sama dengan kartu identitas. Ini sangat penting agar proses verifikasi saat gajian (payout) berjalan mulus tanpa ditolak sistem.</div>
                    
                    <div class="materi-title">Langkah 2: Mengaktifkan Mode Profesional</div>
                    <div class="materi-text">Buka profil Anda, klik tanda titik tiga (...), lalu pilih "Aktifkan Mode Profesional". Pastikan profil tidak dalam kondisi terkunci (Locked) agar jangkauan video Bapak/Ibu bisa luas.</div>

                    <div class="materi-title">Langkah 3: Setting Kategori Kreator</div>
                    <div class="materi-text">Pilih kategori "Kreator Digital" agar Facebook merekomendasikan video Bapak/Ibu kepada orang-orang yang tepat secara otomatis.</div>
                </div>
            `,
            konten: `
                <h2>Rahasia Konten Viral</h2>
                <div class="materi-box">
                    <div class="materi-title">Teknik Hook 3 Detik</div>
                    <div class="materi-text">Dalam video pendek (Reels), penonton sangat cepat berpindah. Gunakan 3 detik pertama untuk menampilkan hasil akhir atau judul yang besar agar orang berhenti menscroll.</div>
                    
                    <div class="materi-title">Pencahayaan & Suara</div>
                    <div class="materi-text">Selalu ambil video di tempat terang (menghadap cahaya matahari). Bersihkan lensa kamera HP Bapak/Ibu agar gambar jernih dan suara terdengar mantap.</div>
                </div>
            `,
            aman: `
                <h2>Keamanan & Anti Banned</h2>
                <div class="materi-box">
                    <div class="materi-title">Dilarang Keras Re-upload</div>
                    <div class="materi-text">Jangan pernah mengambil video dari TikTok, YouTube, atau orang lain. Gunakan video asli buatan Bapak/Ibu sendiri agar akun tidak terkena hukuman "Konten Tidak Asli".</div>
                    
                    <div class="materi-title">Cek Kotak Masuk Dukungan</div>
                    <div class="materi-text">Secara berkala cek menu bantuan untuk melihat apakah ada laporan pelanggaran. Jika ada, segera hapus video tersebut untuk menyelamatkan akun Bapak/Ibu.</div>
                </div>
            `,
            gaji: `
                <h2>Sistem Pembayaran (Gaji)</h2>
                <div class="materi-box">
                    <div class="materi-title">Syarat Payout Minimal</div>
                    <div class="materi-text">Uang akan dikirim ke rekening bank Bapak/Ibu jika sudah mencapai minimal saldo $100 (Sekitar Rp 1,5 Juta). Jika belum sampai, uang tidak akan hangus tapi disimpan untuk bulan depan.</div>
                    
                    <div class="materi-title">Pajak (W-8BEN)</div>
                    <div class="materi-text">Bapak/Ibu wajib mengisi formulir pajak. Jika tidak memiliki NPWP, gunakan nomor NIK KTP Anda sebagai nomor TIN pajak.</div>
                </div>
            `,
            tips: `
                <h2>50 Tips Strategi Kilat</h2>
                <div class="tips-grid" id="tips-container">
                    </div>
            `
        };

        const listTips = [
            "Gunakan nama asli sesuai KTP untuk mempermudah pencairan uang.",
            "Aktifkan Mode Profesional sebelum mengunggah video pertama.",
            "Pastikan Profil tidak dikunci agar iklan bisa masuk.",
            "Pilih kategori 'Kreator Digital' di pengaturan profil.",
            "Atur semua postingan ke publik (jangan hanya teman).",
            "Gunakan foto profil wajah asli yang jelas dan tersenyum.",
            "Hubungkan akun dengan WhatsApp agar pengikut mudah menghubungi.",
            "Hapus postingan lama yang mengandung musik berhak cipta (Copyright).",
            "Jangan pernah melakukan re-upload video milik orang lain.",
            "Fokus pada satu topik konten (niche) agar pengikut loyal.",
            "Unggah minimal 1 video Reels setiap hari secara rutin.",
            "Perhatikan 3 detik pertama video untuk menarik perhatian (Hook).",
            "Gunakan teks tulisan di tengah layar video agar menarik.",
            "Pastikan pencahayaan saat syuting terang (menghadap jendela).",
            "Gunakan suara asli Bapak/Ibu, bukan suara robot.",
            "Pakai musik yang sedang trending (tanda panah naik di FB).",
            "Balas komentar penonton minimal 15 menit setelah posting.",
            "Jangan ajak orang 'Follow Balik' secara terang-terangan.",
            "Gunakan hashtag yang relevan (maksimal 3-5 hashtag saja).",
            "Perhatikan kualitas video minimal HD (1080p).",
            "Hindari watermark aplikasi lain (seperti logo TikTok).",
            "Gunakan fitur 'Balas Komentar dengan Video' untuk interaksi tinggi.",
            "Posting di jam istirahat orang Indonesia (12:00 atau 19:00).",
            "Tulis deskripsi video yang membuat orang ingin berkomentar.",
            "Buat video durasi pendek (7-15 detik) untuk mengejar pengikut.",
            "Buat video panjang (3 menit+) untuk mengejar Dollar besar.",
            "Rutin cek 'Dashboard Profesional' untuk melihat perkembangan.",
            "Segera hapus video jika mendapat peringatan pelanggaran.",
            "Lakukan siaran langsung (Live) minimal seminggu sekali.",
            "Jangan bagikan video sendiri ke grup secara berlebihan (Spam).",
            "Gunakan 'Thumbnail' yang menarik di video panjang.",
            "Pantau statistik 'Jangkauan' untuk tahu video mana yang disukai.",
            "Pelajari cara mengisi data pajak W-8BEN dengan benar.",
            "Pastikan nomor rekening Bank sudah mendukung kiriman internasional.",
            "Cek SWIFT CODE bank Anda sebelum mendaftarkan payout.",
            "Jangan klik link mencurigakan yang mengaku dari Facebook.",
            "Aktifkan Autentikasi Dua Faktor (2FA) agar akun aman.",
            "Bersihkan 'Kotak Masuk Dukungan' secara berkala.",
            "Gunakan tripod agar video tidak goyang (stabil).",
            "Berikan sapaan khas di setiap video agar mudah diingat.",
            "Jangan berdebat dengan penonton yang berkomentar negatif.",
            "Gunakan teknik 'bercerita' (Storytelling) dalam setiap konten.",
            "Lap lensa kamera HP sebelum mulai merekam video.",
            "Perhatikan volume suara latar agar tidak menutupi suara bicara.",
            "Mintalah penonton mengikuti (Follow) di akhir video secara sopan.",
            "Gunakan fitur 'Rekomendasi Profil' untuk memantau kesehatan akun.",
            "Jangan menyerah jika video awal masih sepi penonton.",
            "Belajar dari kreator lain yang sudah sukses gajian.",
            "Jaga kesehatan mata, jangan terlalu lama menatap layar HP.",
            "Berdoa dan luruskan niat untuk berbagi manfaat kepada sesama."
        ];

        function ganti(key) {
            // Update UI Menu
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('m-' + key).classList.add('active');
            
            // Render Content
            document.getElementById('render-materi').innerHTML = database[key];
            
            // Jika memilih tips, isi tips secara otomatis
            if(key === 'tips') {
                let htmlTips = "";
                listTips.forEach((t, i) => {
                    htmlTips += `
                        <div class="tip-card-simple">
                            <div class="tip-number">${i+1}</div>
                            <div style="font-size: 0.95rem;">${t}</div>
                        </div>
                    `;
                });
                document.getElementById('tips-container').innerHTML = htmlTips;
            }
            
            // Auto-close sidebar on mobile
            if(window.innerWidth < 768) {
                document.getElementById('mySidebar').classList.add('closed');
                document.getElementById('myMain').classList.add('expanded');
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
</html>
